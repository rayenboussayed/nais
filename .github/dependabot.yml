version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nest:
        patterns:
          - '@nestjs/*'
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
