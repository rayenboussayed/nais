name: ci
on:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # The changed-file coverage gate needs the PR base / previous commit
          # to exist locally so the pushed diff can be staged (see the gate step).
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          postgres: 'true'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: verify generated API artifacts are current
        run: |
          npm run generate:api
          git diff --exit-code -- generated/ apps/api/test/fixtures/openapi.golden.json
      - run: npm run test:cov
      - name: drizzle migration consistency check
        run: npm run db:check
      - name: drizzle migration drift check
        run: npm run db:generate --workspace=@trainslator/api
      - name: ensure generated migrations are committed
        run: git diff --exit-code -- apps/api/drizzle
      - run: npm run knip
      - run: npm audit --omit=dev --audit-level=high
      - name: changed-file coverage gate (CI only; not in check or husky)
        # Bare `--changed` only sees staged/uncommitted files and a CI checkout
        # is clean. Move HEAD to the base so the pushed/PR diff becomes staged,
        # which is exactly what `vitest --changed` inspects. Clear the summary
        # from the earlier full run so the guard below cannot read stale totals.
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$BASE" in
            ''|0000000000000000000000000000000000000000) BASE=HEAD~1 ;;
          esac
          git reset --soft "$BASE"
          rm -f coverage/coverage-summary.json
          npm run test:cov:changed
          node scripts/assert-changed-coverage.mjs
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          postgres: 'true'
      - run: npm run build
      - run: npm run test:e2e
